name: Como Estamos

on:
  schedule:
    # Varias horas por si GitHub se salta o retrasa alguna (pasa seguido cerca de las 00:00 UTC).
    # Solo la primera que corra envía el reporte; las demás ven que ya se envió y no hacen nada.
    # 00:13 UTC = 7:13 p. m. | 00:47 UTC = 7:47 p. m. | 01:37 UTC = 8:37 p. m. | 03:07 UTC = 10:07 p. m. (hora Colombia)
    # Los domingos también envía el resumen semanal.
    - cron: "13 0 * * *"
    - cron: "47 0 * * *"
    - cron: "37 1 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch: # permite ejecutarlo manualmente para probar
    inputs:
      modo:
        description: "Qué reporte enviar"
        type: choice
        options:
          - auto
          - diario
          - semanal
        default: auto

# Evita que dos corridas se pisen
concurrency:
  group: como-estamos
  cancel-in-progress: false

# Permite que el bot guarde su memoria (historial.json) en el repositorio
permissions:
  contents: write

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event.inputs.modo || 'auto' }}
          EVENTO: ${{ github.event_name }}
        run: python bot.py

      - name: Guardar memoria del día
        run: |
          if [ -f historial.json ]; then
            git config user.name "como-estamos-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historial.json
            if ! git diff --cached --quiet; then
              git commit -m "Memoria del día"
              git pull --rebase
              git push
            fi
          fi
