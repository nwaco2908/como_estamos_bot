name: Como Estamos

on:
  schedule:
    # 00:05 UTC = 7:05 p. m. hora Colombia (justo después del cierre diario).
    # Los domingos también envía el resumen semanal.
    - cron: "5 0 * * *"
  workflow_dispatch: # permite ejecutarlo manualmente para probar
    inputs:
      modo:
        description: "Qué reporte enviar"
        type: choice
        options:
          - auto
          - diario
          - semanal
        default: auto

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event.inputs.modo || 'auto' }}
        run: python bot.py
