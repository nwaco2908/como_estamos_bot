name: Backtest histórico

# Solo se ejecuta cuando tú lo lanzas (Actions → Backtest histórico → Run workflow).
# Envía el informe a tu chat personal de Telegram (el primer destino de TELEGRAM_CHAT_ID).
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ejecutar backtest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest.py
